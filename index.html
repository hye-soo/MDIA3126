<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hye Shim MDIA3126 Assignment # 1</title>
    <style>
        html {
            font-family: sans-serif;
            margin: 40px;
        }

        /* BUTTON COMPONENT */
        .c-button {
            padding: 8px;
            border-radius: 4px;
            font-size: 16px;


            /* PRIMARY MODIFIER */
            &.c-button--primary {
                background-color: skyblue;
                color: black;
            }

            /* SECONDARY MODIFIER */
            &.c-button--secondary {
                background-color: gray;
                color: black;
            }

            /* DISABLED MODIFIER */
            &.c-button--disabled {
                background-color: lightpink;
                color: red;
                cursor: not-allowed;
            }

            /* OUTLINE MODIFIER */
            &.c-button--outline {
                background-color: transparent;
                color: blue;
                border: 4px dashed blue;
            }
        }
    </style>

</head>

<body>
    <h1>Button Component</h1>

    <h2>Primary Button</h2>
    <button class="c-button c-button--primary">
        Primary
    </button>

    <h2>Secondary Button</h2>
    <button class="c-button c-button--secondary">
        Secondary
    </button>

    <h2>Disabled Button</h2>
    <button class="c-button c-button--disabled" disabled>
        Disabled
    </button>

    <h2>Outline Button</h2>
    <button class="c-button c-button--outline">
        Outline
    </button>

</body>

</html>
